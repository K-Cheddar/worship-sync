<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorshipSync</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="theme-color" content="#2b3544" />
    <!-- iOS Safari ignores the manifest's display/name; these are its equivalents. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque, not "black-translucent": translucent draws web content *under* the
         status bar, and the app does not yet apply env(safe-area-inset-top)
         padding. Switch to black-translucent only alongside that layout work. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="WorshipSync" />
    <!-- <link rel="stylesheet" href="/initial.css" /> -->
    <meta
      name="description"
      content="Web-based software for managing the display of content for worship services"
    />
    <!-- Custom schemes must be listed here too: a meta CSP is AND-combined
         with Electron's header CSP, so omitting them blocks local media. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https: http: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: http:; style-src 'self' 'unsafe-inline' https: http: data:; font-src 'self' data: https: http:; img-src 'self' data: blob: media-cache: worshipsync-media: https: http:; media-src 'self' https: http: blob: media-cache: worshipsync-media:; connect-src 'self' https: http: ws: wss: media-cache: worshipsync-media:; frame-src 'self' blob: https: http:; worker-src 'self' blob: https:; child-src 'self' blob: https:; object-src 'none'; base-uri 'self';"
    />
  </head>
  <body
    style="
      background-color: transparent;
      height: 100dvh;
      width: 100dvw;
      overflow: hidden;
    "
  >
    <noscript>You need to enable JavaScript to run WorshipSync.</noscript>
    <div
      id="root"
      style="
        background-color: transparent;
        height: 100dvh;
        width: 100dvw;
        overflow: hidden;
      "
    ></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
