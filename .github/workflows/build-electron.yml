name: Build Electron App

# Manual native builds for validating or rebuilding the selected platform(s).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        required: true
        default: both
        options:
          - both
          - windows
          - macos

permissions:
  contents: read

jobs:
  build:
    name: Build Electron (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["windows","macos"]' || inputs.platform == 'windows' && '["windows"]' || '["macos"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Restore Electron build caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron
            ${{ runner.temp }}/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('client/package-lock.json') }}

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron

      - name: Build Electron app
        run: npm run build:electron --prefix client
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package Windows app
        if: matrix.platform == 'windows'
        run: npx electron-builder --win --publish never --config electron-builder.config.js
        working-directory: client
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package macOS app (unsigned)
        if: matrix.platform == 'macos'
        run: npx electron-builder --mac --publish never --config electron-builder.config.js
        working-directory: client
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: electron-win
          path: |
            client/dist/*.exe
            client/dist/*.exe.blockmap
            client/dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: electron-mac
          path: |
            client/dist/*.dmg
            client/dist/*.dmg.blockmap
            client/dist/*.zip
            client/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 30
