name: Auto Release

permissions:
  contents: write
  id-token: write

on:
  push:
    branches: [master]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.semantic_release.outputs.published }}
      version: ${{ steps.semantic_release.outputs.version }}
      tag: ${{ steps.semantic_release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: client

      # Keep release-time tests as a safety net for directly updated master refs.
      - name: Test
        run: npm test
        working-directory: client

      # This build uploads browser source maps to Sentry. Heroku builds its own
      # Heroku-mode bundle during deployment and does not use client/dist here.
      - name: Build web and upload Sentry source maps
        run: npm run build
        working-directory: client
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Configure git for version.json commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Semantic release
        id: semantic_release
        run: npm run release:ci
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_PAT }}

  build-electron:
    name: Build Electron (${{ matrix.os }}, ${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Restore Electron build caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron
            ${{ runner.temp }}/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('client/package-lock.json') }}

      - run: npm ci

      - run: npm ci
        working-directory: client
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron

      - name: Build Electron app
        run: npm run build:electron
        working-directory: client
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never --config electron-builder.config.js
        working-directory: client
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder

      - name: Package Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never --config electron-builder.config.js
        working-directory: client
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder

      - name: Package macOS (unsigned)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never --config electron-builder.config.js
        working-directory: client
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Persist Linux release assets
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux
          path: |
            client/dist/*.AppImage
            client/dist/*.deb
            client/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 3

      - name: Persist Windows release assets
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: electron-win
          path: |
            client/dist/*.exe
            client/dist/*.exe.blockmap
            client/dist/latest.yml
          if-no-files-found: error
          retention-days: 3

      - name: Persist macOS release assets
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: electron-mac
          path: |
            client/dist/*.dmg
            client/dist/*.dmg.blockmap
            client/dist/*.zip
            client/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 3

  publish-electron-release:
    name: Publish Electron release assets
    needs: [release, build-electron]
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download platform release assets
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: release-assets
          merge-multiple: true

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            release-assets/*.exe
            release-assets/*.exe.blockmap
            release-assets/latest.yml
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/latest-linux.yml
            release-assets/*.dmg
            release-assets/*.dmg.blockmap
            release-assets/*.zip
            release-assets/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_PAT }}

  deploy-heroku:
    name: Deploy Heroku
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_PAT }}

      # Heroku's Node buildpack runs root heroku-postbuild to create its bundle.
      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/${{ secrets.HEROKU_APP_NAME }}.git
          git push heroku HEAD:refs/heads/main --force
