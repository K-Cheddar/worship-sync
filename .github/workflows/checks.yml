name: Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR numbers isolate pull requests; event and ref keep manual runs independent.
  # New commits to a PR supersede older validation for that same PR.
  group: checks-${{ github.workflow }}-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  client_tests:
    name: Client Jest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server dependencies for cross-boundary client tests
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Get UTC cache date
        id: cache_date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore Jest transform cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jest-cache-${{ matrix.shard }}
          key: ${{ runner.os }}-node24-jest-shard-${{ matrix.shard }}-${{ hashFiles('client/package-lock.json', 'client/jest.config.cjs', 'client/jestImportMetaTransform.cjs', 'client/tsconfig.jest.json') }}-${{ steps.cache_date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-node24-jest-shard-${{ matrix.shard }}-${{ hashFiles('client/package-lock.json', 'client/jest.config.cjs', 'client/jestImportMetaTransform.cjs', 'client/tsconfig.jest.json') }}

      - name: Run client Jest shard
        env:
          CI_JEST_SHARD: ${{ matrix.shard }}
          JEST_CACHE_DIRECTORY: ${{ runner.temp }}/jest-cache-${{ matrix.shard }}
        run: >-
          npm test --prefix client --
          --shard=${{ matrix.shard }}/4
          --maxWorkers=2
          --cacheDirectory="$JEST_CACHE_DIRECTORY"

  server_tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies for browser integration
        run: npm ci --prefix client

      - name: Install Chromium for browser integration
        run: npx playwright install --with-deps chromium

      - name: Run unauthenticated schedule quick-member browser fixture
        run: npm run test:e2e:schedule-quick-member --prefix client

      - name: Build client for server browser integration
        run: npm run build:heroku --prefix client

      - name: Generate temporary TLS certificate for browser integration
        run: openssl req -x509 -newkey rsa:2048 -nodes -keyout client/local.worshipsync.net-key.pem -out client/local.worshipsync.net.pem -days 1 -subj "/CN=127.0.0.1"

      - name: Run server tests with Firestore emulator integration
        run: npx --yes firebase-tools@14.4.0 emulators:exec --only firestore --project demo-worshipsync "npm run test:server"

  lint_typecheck:
    name: Client ESLint and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        id: install_root
        run: npm ci

      - name: Install client dependencies
        id: install_client
        run: npm ci --prefix client

      - name: Run ESLint
        run: npm run lint:check --prefix client

      - name: Run TypeScript check
        if: always() && steps.install_root.outcome == 'success' && steps.install_client.outcome == 'success'
        run: npm run type-check --prefix client

  heroku_build:
    name: Heroku production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build Heroku production bundle
        run: npm run build:heroku --prefix client

  electron_build:
    name: Electron production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Restore Electron build caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('client/package-lock.json') }}

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build Electron bundles
        run: npm run build:electron --prefix client

  # Keep this status name stable for branch protection; it only aggregates CI.
  checks:
    name: npm run checks
    if: always()
    needs:
      [
        client_tests,
        server_tests,
        lint_typecheck,
        heroku_build,
        electron_build,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify CI workflow contract
        run: node --test .github/scripts/verify-checks-status.test.cjs

      - name: Verify every required check succeeded
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/verify-checks-status.cjs
