name: Checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      coverage:
        description: Run client coverage and enforce global thresholds
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core_checks:
    name: Server tests, client Jest, ESLint, and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      # Run coverage for production promotion PRs and opted-in manual runs.
      - name: Run checks with coverage
        if: (github.event_name == 'pull_request' && github.base_ref == 'master') || (github.event_name == 'workflow_dispatch' && inputs.coverage)
        run: npm run checks:coverage

      - name: Run checks without coverage
        if: (github.event_name != 'pull_request' || github.base_ref != 'master') && (github.event_name != 'workflow_dispatch' || !inputs.coverage)
        run: npm run checks

  heroku_build:
    name: Heroku production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build Heroku production bundle
        run: npm run build:heroku --prefix client

  electron_build:
    name: Electron production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Restore Electron build caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('client/package-lock.json') }}

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build Electron bundles
        run: npm run build:electron --prefix client

  checks:
    name: npm run checks
    if: always()
    needs: [core_checks, heroku_build, electron_build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify every required check succeeded
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/verify-checks-status.cjs
